<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard - Kagaru Academy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f4f4f4; margin: 0; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        .login-box { text-align: center; margin-top: 80px; }
        .password-wrapper { position: relative; display: inline-block; width: 80%; max-width: 300px; margin-bottom: 15px; }
        .password-wrapper input { width: 100%; box-sizing: border-box; padding: 12px; padding-right: 40px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        .toggle-password { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 20px; user-select: none; }
        .login-box button { padding: 12px 30px; cursor: pointer; background: #2c3e50; color: white; border: none; border-radius: 5px; font-size: 16px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        .logout-btn { background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .tabs { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .tab-btn { flex: 1; padding: 12px; cursor: pointer; background: #bdc3c7; border: none; border-radius: 5px; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: #2c3e50; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9em; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #2c3e50; color: white; }
        .announcement-form input, .announcement-form textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-family: inherit; }
        .announcement-form button { background: #27ae60; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .announcement-item { background: #f9f9f9; border-left: 4px solid #2c3e50; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div id="login-screen" class="login-box">
            <h2>Admin Login</h2>
            <p>Enter password to access the management system.</p>
            <div class="password-wrapper">
                <input type="password" id="adminKey" placeholder="Enter Admin Password">
                <span class="toggle-password" onclick="togglePassword()">👁️</span>
            </div>
            <br>
            <button onclick="login()">Login</button>
            <p id="login-error" style="color:red; display:none;">Invalid password. Try again.</p>
        </div>

        <!-- Dashboard Screen -->
        <div id="dashboard" class="hidden">
            <div class="header-bar">
                <h2>Kagaru Academy Admin</h2>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="showTab('payments', event)">💰 Payments</button>
                <button class="tab-btn" onclick="showTab('bookings', event)">📝 Bookings</button>
                <button class="tab-btn" onclick="showTab('announcements', event)">📢 Announcements</button>
            </div>

            <div id="payments-tab">
                <h3>Recent Payments</h3>
                <table id="payments-table">
                    <thead><tr><th>Name</th><th>Grade</th><th>Amount</th><th>M-Pesa</th><th>Date</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>

            <div id="bookings-tab" class="hidden">
                <h3>Interview Bookings</h3>
                <table id="bookings-table">
                    <thead><tr><th>Grade</th><th>Age</th><th>Interview Date</th><th>File Attached</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>

            <div id="announcements-tab" class="hidden">
                <h3>Make a New Announcement</h3>
                <div class="announcement-form">
                    <input type="text" id="ann-title" placeholder="Announcement Title">
                    <textarea id="ann-msg" placeholder="Type your message to parents here..." rows="4"></textarea>
                    <button onclick="postAnnouncement()">Post Announcement</button>
                </div>
                <hr style="margin: 30px 0;">
                <h3>Existing Announcements</h3>
                <div id="ann-list"></div>
            </div>
        </div>
    </div>

    <script>
        // ==============================================================
        // YOUR LIVE RENDER URL HAS BEEN ADDED BELOW
        // ==============================================================
        const API_URL = "https://kagaru-academy.onrender.com"; 

        function togglePassword() {
            const input = document.getElementById('adminKey');
            if (input.type === "password") {
                input.type = "text";
            } else {
                input.type = "password";
            }
        }

        async function login() {
            const password = document.getElementById('adminKey').value;
            const errorMsg = document.getElementById('login-error');
            errorMsg.style.display = 'none';

            try {
                const res = await fetch(`${API_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: password })
                });

                if (res.ok) {
                    localStorage.setItem('adminPassword', password);
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    loadData();
                } else {
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                console.error("Connection error:", err);
                errorMsg.innerText = "Cannot connect to server. Check your internet or API URL.";
                errorMsg.style.display = 'block';
            }
        }

        function logout() {
            localStorage.removeItem('adminPassword');
            location.reload();
        }

        function showTab(tabName, event) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            ['payments', 'bookings', 'announcements'].forEach(t => {
                document.getElementById(t + '-tab').classList.add('hidden');
            });
            document.getElementById(tabName + '-tab').classList.remove('hidden');
        }

        async function loadData() {
            const password = localStorage.getItem('adminPassword');
            if (!password) return logout();

            const headers = { 'authorization': password };

            try {
                const payRes = await fetch(`${API_URL}/api/admin/payments`, { headers });
                if (!payRes.ok) return logout();
                const payments = await payRes.json();
                document.querySelector('#payments-table tbody').innerHTML = payments.map(p => `<tr><td>${p.name}</td><td>${p.grade}</td><td>KSh ${p.amount}</td><td>${p.mpesa}</td><td>${new Date(p.date).toLocaleDateString()}</td></tr>`).join('');

                const bookRes = await fetch(`${API_URL}/api/admin/bookings`, { headers });
                const bookings = await bookRes.json();
                document.querySelector('#bookings-table tbody').innerHTML = bookings.map(b => `<tr><td>${b.grade}</td><td>${b.age}</td><td>${b.date}</td><td>${b.fileName}</td></tr>`).join('');

                const annRes = await fetch(`${API_URL}/api/announcements`);
                const anns = await annRes.json();
                const annList = document.getElementById('ann-list');
                if(anns.length === 0) annList.innerHTML = "<em>No announcements yet.</em>";
                else annList.innerHTML = anns.map(a => `<div class="announcement-item"><strong>${a.title}</strong><br>${a.message}</div>`).join('');

            } catch (error) {
                console.error("Error loading data:", error);
            }
        }

        async function postAnnouncement() {
            const password = localStorage.getItem('adminPassword');
            const title = document.getElementById('ann-title').value;
            const message = document.getElementById('ann-msg').value;
            
            if(!title || !message) return alert("Please fill in both title and message.");

            try {
                const res = await fetch(`${API_URL}/api/admin/announcement`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'authorization': password },
                    body: JSON.stringify({ title, message })
                });

                if (res.ok) {
                    alert("Announcement Posted Successfully!");
                    document.getElementById('ann-title').value = '';
                    document.getElementById('ann-msg').value = '';
                    loadData();
                } else {
                    alert("Error posting announcement.");
                }
            } catch (e) {
                alert("Error posting announcement.");
            }
        }

        if(localStorage.getItem('adminPassword')) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            loadData();
        }
    </script>
</body>
</html>
